apiVersion: v1
kind: Service
metadata:
  name: churn-model-api
  namespace: churn-model
  labels:
    app: churn-model-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  selector:
    app: churn-model-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: churn-model-api-internal
  namespace: churn-model
  labels:
    app: churn-model-api
spec:
  type: ClusterIP
  selector:
    app: churn-model-api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
