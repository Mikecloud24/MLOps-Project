apiVersion: v1
kind: Namespace
metadata:
  name: churn-model
  labels:
    name: churn-model
    app.kubernetes.io/name: churn-model
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-s3-access
  namespace: churn-model
  labels:
    app.kubernetes.io/name: churn-model
  annotations:
    # IRSA: Replace with your IAM role ARN after creating it with eksctl
    # Example: eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/churn-model-s3-role
    eks.amazonaws.com/role-arn: arn:aws:iam::817471703433:policy/ChurnModelS3Access
